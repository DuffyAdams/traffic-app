server {
    listen 80;
    listen [::]:80;
    server_name beta.duffyadams.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://beta.duffyadams.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beta.duffyadams.com;

    ssl_certificate /etc/letsencrypt/live/beta.duffyadams.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.duffyadams.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location /assets/ {
        alias /home/ubuntu/projects/san-diego-traffic-watch-beta/traffic-app/dist/assets/;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /map_tiles/ {
        alias /home/ubuntu/projects/san-diego-traffic-watch-beta/traffic-app/dist/map_tiles/;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }
}
