server {
    listen 80;
    listen [::]:80;
    server_name beta.duffyadams.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 410;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beta.duffyadams.com;

    ssl_certificate /etc/letsencrypt/live/beta.duffyadams.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.duffyadams.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 410;
    }
}
