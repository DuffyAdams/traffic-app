server {
    listen 80;
    listen [::]:80;
    server_name metrics.duffyadams.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://metrics.duffyadams.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name metrics.duffyadams.com;

    ssl_certificate /etc/letsencrypt/live/metrics.duffyadams.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metrics.duffyadams.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;
    root /home/ubuntu/projects/san-diego-traffic-watch/metrics-app;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
